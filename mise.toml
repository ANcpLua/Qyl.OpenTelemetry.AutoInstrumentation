# The local build and release toolchain. `mise install` installs these pinned versions;
# dotnet also keeps global.json, which dotnet itself reads.
[tools]
"dotnet" = "10.0.401"
"github:open-telemetry/weaver" = "0.27.0"

[tasks.check]
description = "The full local gate: build, contracts, consumers, NativeAOT, Docker demos and live registry"
run = [
  "python3 tools/verify-aot-autoinstrumentation-goal.py",
]
