# The toolchain this repository builds with. CI installs it with jdx/mise-action;
# locally `mise install` does the same. dotnet also keeps global.json, which dotnet itself reads.
[tools]
"dotnet" = "10.0.401"
"ubi:open-telemetry/weaver" = "0.26.1"

[tasks.check]
description = "The gate: the release build and the goal verifier CI runs"
run = [
  "dotnet build Qyl.Telemetry.AutoInstrumentation.slnx --configuration Release",
  "python3 tools/verify-aot-autoinstrumentation-goal.py",
]
