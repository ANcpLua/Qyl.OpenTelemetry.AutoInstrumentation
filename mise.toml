# The local build and release toolchain. `mise install` installs these pinned versions;
# dotnet also keeps global.json, which dotnet itself reads. Weaver serves ./eng/build.sh LiveCheck.
[tools]
"dotnet" = "10.0.401"
"github:open-telemetry/weaver" = "0.27.0"

[tasks.check]
description = "The gate before a push or a release: ./eng/build.sh Check"
run = "./eng/build.sh Check"

[tasks.check-full]
description = "Everything, on demand: ./eng/build.sh CheckFull"
run = "./eng/build.sh CheckFull"
