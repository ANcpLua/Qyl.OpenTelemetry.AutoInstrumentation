name: Credential health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths: ['.github/workflows/credential-health.yml']
permissions:
  contents: read
concurrency:
  group: credential-health
  cancel-in-progress: false
jobs:
  github:
    name: github
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ANcpLua/vitals
          ref: e5e69cf086b93ef511cb501fcc9d013e6d3f347c
          path: .vitals
          sparse-checkout: Sources/VitalsKernel/credential_health.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Probe credentials
        id: probe
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHECK_REPOSITORY: ${{ github.repository }}
        run: python3 .vitals/Sources/VitalsKernel/credential_health.py --probe github
      - name: Credential accepted
        if: steps.probe.outputs.state == 'valid'
        run: echo "Read-only authentication passed"
      - name: Credential rejected
        if: steps.probe.outputs.state == 'invalid'
        run: exit 1
      - name: Credential scope mismatch
        if: steps.probe.outputs.state == 'scopeMismatch'
        run: exit 1
      - name: Credential absent
        if: steps.probe.outputs.state == 'missing'
        run: exit 1
      - name: Check not configured
        if: steps.probe.outputs.state == 'unchecked'
        run: exit 1
      - name: Provider unavailable
        if: steps.probe.outputs.state == 'unavailable'
        run: exit 1
