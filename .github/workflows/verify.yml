name: qyl-verify

# The no-Docker validation floor: the verify-*.py suite that proves contract invariants,
# public-API baselines, generator snapshots, package layout, projectreference behavior,
# xml-doc, options/disabled behavior, and the source + NativeAOT consumers. Run via the handoff
# orchestrator, minus the container-backed real demos (--no-demos -> verify-real-demos.yml) and
# the gates that have their own workflow.
#
# Two cost-balanced shards per OS (--shard weighs each verifier by its recorded runtime): the
# generator snapshot build alone is ~3.6 min, everything else together ~3.2 min, so a third or
# fourth shard only adds another queued runner — the macOS pool is 5 jobs for the whole account.

on:
  push:
    branches:
      - main
  pull_request:

# One live run per ref: superseded pushes cancel their queued/running predecessors,
# so superseded work never wastes runner minutes.
concurrency:
  group: qyl-verify-${{ github.ref }}
  # Sequential commits on main must each run to completion, so only other refs cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.shard }}/2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        os:
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Python verifier dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Run the no-Docker validation floor
        run: >-
          python3 tools/verify-aot-autoinstrumentation-goal.py
          --no-demos
          --skip "smoketest,webapi aot demo,otlp receiver evidence,live check,nativeaot publish gate"
          --shard ${{ matrix.shard }}/2
