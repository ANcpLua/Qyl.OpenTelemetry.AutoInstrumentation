name: qyl-verify-real-demos

# The 29 real-demo verifiers (Kafka, Mongo, Redis, RabbitMQ, Postgres, MySQL, Oracle,
# Elasticsearch, gRPC, Azure, WCF, …). They execute real consumers and assert emitted
# telemetry end-to-end; the applicable lanes also NativeAOT-publish and use testcontainers.
# Linux-only because the integration subset needs Docker. Heavy, so it runs post-merge on
# main and on demand — not on every feature push. Run the whole gate locally with:
#   python3 tools/verify-aot-autoinstrumentation-goal.py --demos-only

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One live run per ref: superseded pushes cancel their queued/running predecessors,
# so superseded work never wastes runner minutes.
concurrency:
  group: qyl-verify-real-demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-demos:
    name: real demos
    # x64 on purpose: mcr.microsoft.com/mssql/server ships no arm64 image (the old
    # OrbStack VM hid that via Rosetta emulation). This lane verifies container-backed
    # runtime behavior, not ARM coverage — verify/smoke/gate keep the ARM legs.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Python verifier dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Run the container-backed real-demo verifiers
        run: python3 tools/verify-aot-autoinstrumentation-goal.py --demos-only
