name: qyl-aot-publish-gate

# Pins the NativeAOT warning-cleanliness classification of the demo matrix (tools/verify-aot-publish-gate.py):
#   * CLEAN set must AOT-publish warning-clean under strict TreatWarningsAsErrors (catches a qyl
#     regression that introduces reflection / breaks AOT — the primary signal).
#   * VENDOR_WARNED set must still AOT-publish with warnings relaxed (hard-break detection), and a
#     "promotion" is flagged when an upstream library shipped AOT annotations and is now warning-clean.
#
# Heavy (24 NativeAOT publishes x 2 OS), so — like verify-real-demos.yml — it runs post-merge on
# main, nightly, and on demand, NOT on every PR. The gate prebuilds the source generator into the
# standard artifacts/ layout (the PublishAot demos consume it as a prebuilt Analyzer DLL from there)
# and publishes with --disable-build-servers. A running gate is never cancelled; a push that lands
# while one waits replaces the waiting run, so a burst of merges is gated once, on its newest commit,
# instead of stacking 4 macOS jobs per commit in the account's 5-job macOS queue ahead of every PR.
# Run locally: python3 tools/verify-aot-publish-gate.py --set all --strict-promotion --shard ${{ matrix.shard }}/4

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: qyl-aot-publish-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aot-publish-gate:
    name: aot-publish-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        os:
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Python verifier dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: AOT-publish warning-cleanliness gate (CLEAN regression + VENDOR_WARNED hard-break/promotion)
        run: python3 tools/verify-aot-publish-gate.py --set all --strict-promotion --shard ${{ matrix.shard }}/4
