name: qyl-otlp-receiver

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: qyl-otlp-receiver-${{ github.ref }}
  # Sequential commits on main must each run to completion, so only other refs cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  receiver:
    name: typed OTLP receiver evidence
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/verify-otlp-receiver.py
